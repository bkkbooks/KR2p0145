body:
  text: 一一景公飲酒三日而后發晏子見曰君病酒乎公曰然三日而后發晏子合曰古之飲酒也足以道合好而已矣故男不羣樂以事女不羣樂觴五獻過者死君身服之故上无怨治下一日飲酒三日𡨦之國治怨外左右亂乎內以刑罰自妨者勸乎為非以賞譽自勸者隋乎為善上離德二翟王子羊臣於景公以重駕公弗說嬰子欲觀之公曰及晏子𡨦病也居又中臺上以觀之嬰子說之因為請公許之晏子見公曰翟王子羊之駕也寡人甚說之吾欲祿之以萬其足乎晏子進合曰公言過矣昔衛士東之駕也羊之駕也公弗說嬰子說之公因說君子所今夫駕六駕八固非先王之制也今有重之此其城之務善遂三景公之公曰異𢦏令所堵於毋言其名出氣事者兼月脊者歲子曰晏子能明其所欲景公能行其所善四景公將伐宋師過大山公吾薨有二丈夫立而怒狀志其聲公恐學痛磒辟門召占薨者曰今昔吾薨二丈夫立而怒其怒甚盛吾猶其狀志其聲占薨者曰師過大山不用事故大山之神怒趣者之言曰師過大山而不用事故大山之神怒今吾欲使人誅祝史晏子付有間卬而合曰占薨者弗識也是非大山之神也是宋之先也湯與伊尹也公疑猶以為大山晏子曰公疑之則嬰請門湯逢下居身而陽聲公曰伊尹黑以短以逢逢上而兌而下聲公唯宋耳而公伐之故湯伊尹怒請散師和乎子曰公伐无罪之國以怒明神不易行進師以戰禍非嬰之所智也師若果進軍必有𢦏軍進再舍將壹軍鼓毀公恐辤不果伐宋五景公登洛𡨦之臺不能冬上而息於陛公曰孰為高臺其病人之甚也晏子使民如罪也夫古之為宮室臺榭者節於身而調於民不以為奢侈及夏也其王桀伓行棄義作為頃宮臺殷之也其王紂作為環室玉門廣大者有賞埤小者有罪是以身及焉今君埤亦有罪高亦有罪吏從事不免於罪臣主俱困而无所辟患六景公興兵將伐魯問晏子晏子曰不可魯君好義而民戴義者安見戴者和安和之禮存焉未可攻也攻義者不羊危安者必困且嬰聞之伐人者德足以安其國正足以和其民國安民和然后可以興兵而正暴今君好酒而養辟德无以安國厚耤斂急使令正无以和民德无以安之則危正无和之則亂未免乎危亂之禮而之國不可不若脩德而侍其亂也其怨上然后伐之則義厚而適寡利多則民勸公曰善不果伐魯七景公問晏子曰寡人志氣甚身體甚病今吾欲具圭璧犧生令祝宗薦之上下意者體可奸福乎晏子曰嬰聞之古者先君之福也正必合乎民行必順乎神故節宮室毋敢大斬伐毋以服山林節飲食毋敢多田魚以毋伓川睪祝宗用事辤罪而也是以神民俱順而山川入琭今君之正反乎民行孛乎神大宮室而多斬伐是以神民俱怨而山川收祿司過薦至而祝宗福意逆乎公曰寡人非夫子无聞此請革心易行於是止海食之獻斬伐者者有數居處飲食節勿羨祝宗用事辤罪而不敢有求也故鄰國患之百生親之晏子沒而後衰八景公問晏子曰賢君之治國何若賢君之治國也其正任賢其行愛民其取下其自養斂在上不犯下任治不驁窮從邪害民者舉過者有賞其正刻上而饒下正而朹窮不因喜以加賞不因怒以加罰怒以危國上无喬行下无凷德上毋私眾下无私義毋㱙橐之臧毋涷餒之民是以其士民藩茲而尚同民安樂而尚親賢君之治國若此九景公問於晏子曰明王之教民何若晏子合曰明令先之以行養民不苛而之以刑所求於下者弗務於上所禁於民者弗行於身守以利立法義不犯之以邪笱所求於民不以事以任民中聽以禁邪不窮之以勞不害之以實笱所求於民不以事逆故下不敢犯禁也古者百里異名千里異習故明王脩道不相遺也此明王之教民也十景公問晏子曰忠臣之行何如合曰忠臣不合乎前弗華於外篡位以為忠不刻事大子國危不交諸侯順則進不則退不與君行邪此忠臣之行也公有問曰佞人之事君何如合曰意難之不至也明言行飭其无欲也兌其交觀上欲而微為之竊求君之比壐爵而外輕之以誣行而面公正以偽廉誣行偽廉以夜上工於取蜚乎觀於新曼乎故鄰於財薄乎施堵貧窮若弗式騶富利若弗及非譽不徵乎請而言不合乎行身殷存所義而好論賢不宵有之己不難非之人无之己不難求之人此佞人之行也十一樂民有問民行莫賤於害民有問曰鄰嗇之於行何如合曰嗇者君子之道也粦愛者小人之行也叔鄉曰何謂也合曰而節用之富无貸之謂嗇積財不能分人獨自養之謂粦不能自養有不能分人之謂愛故嗇者君子粦愛者小人之行也十二晏子為壯公臣言用晦朝賜爵益邑我而不用晦朝致邑與爵爵邑盡退朝而乘渭然𢠦𢠦終而笑其僕曰𢠦笑相從之數也晏子曰吾𢠦也哀吾君必不免於難也吾笑吾夕无死已崔杼果式壯公晏子立於崔子之門從者曰何不死乎晏子曰獨吾君輿吾死也何不去乎曰吾罪輿才吾亡也然則何不君死焉歸夫君人者幾以泠民社禝是主也故君為社禝死則死之君為社禝亡則亡之若君為己死為己其私親孰敢任之人有君而殺之吾焉得死焉得亡門啟而入崔子曰晏子子曰過始弗智也過眾弗智也吾何為死且吾聞之以亡為行者不足以存君以死為義者不足以立功嬰幾婢子才縊而從之但免枕君哭興九甬而出十三景公令脩茖𡨦之臺臺成公不尚焉柏常鶱見曰甚急今成何為不尚焉公曰然每鳴焉其聲无不為也吾是以不尚焉柏常鶱曰臣請而去之公曰若令官具柏常鶱之求柏常鶱曰无求也請筑新室以茅之室成具白茅而已矣柏常鶱夜用事焉旦見於公曰今夜尚聞梟聲乎公曰吾壹聞矣柏常鶱曰令人視之梟矣公令人視之梟布翼伏地而死乎臺下公喜曰子能請柏常鶱曰能公曰益幾何合曰天子九諸侯七大夫五公曰益壽有徵兆乎柏常鶱曰然益壽地將動公喜令數為之令官具柏常鶱之求後者不用令之罪柏常鶱出曹晏子於涂曰前日公令脩臺臺成而公不尚焉鶱見而問之君曰有梟夜鳴焉吾惡之故不尚焉鶱為君之而梟已死矣君謂鶱曰女能請鬼神殺梟而不能益寡人之壽乎鶱合曰能君曰若為之今鶱將大祭以為君請壽故將往以聞晏子誒夕善矣能為君請壽雖然徒祭可以益壽柏常鶱曰可晏子曰嬰聞之雖正順可以益壽而已矣今徒祭可以益壽若謹為之然得壽則有見乎柏常鶱曰得壽曰昔吾見維星絕樞星散地其幾動女以是乎柏常鶱付有間合曰然晏子曰為弗為損年數為之而毋求財官十四高子問晏心壹與夫子之心三與晏子曰善𢦏問事君嬰聞之一心可以事百君三心不可事嬰心非三也且嬰之事公也尚勇力勝欲辟於邪而嬰弗能禁也故退而鯉處嬰聞之言不用者不受其祿不善其事不與難吾於壯公行之矣今之君輕國重樂薄民君乎十五中泥之齊見景公景公說之將封之以壐稽以告晏下好樂而親治立令而殆不可使守職久喪而循哀不可使子民容不可以道之烕周室之卑民行茲薄聲樂充而世茲衰今孔丘盛為容飭以蛊世𥾏歌眾博學不思不可補民纍讎不能亶其教當年不能行其禮積材不能譫其樂飭降登以營世君盛為聲樂以淫愚民其道不可以視世其教不可以道眾今君封之移齊俗非所以道國先民也公曰善於是重其禮而留其奉敬見之而不問其道中泥去十六晏子沒十有七年公飲諸大夫酒公射出質堂上昌公組色大息蕃弓矢𥾏章入公曰章自吾失於今十有七年未嘗聞吾不善今射出質昌善者若出一口𥾏章合曰此諸臣之不宵也智不足以智君之不善勇不足不以犯君之此諸臣之不宵也然而有一焉臣聞斥汙食黃其身黃食青其身青君其有食乎凷人之言輿公曰善𥾏章出自海入魚五十乘以賜𥾏章章歸魚塞之手曰襄之昌善者皆欲若魚者也昔者晏子辤賞以正君故過不弇今諸臣凷臾以弋利故出質而昌善若出一口今所以補君未見於晏子之義而順凷臾之欲也固辤而弗受公曰𥾏章之廉晏子之
